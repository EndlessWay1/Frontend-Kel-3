<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NASI LIWET: ADMIN</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />

  <link rel="stylesheet" href="style.css"/>
</head>

<body>

  <!-- HEADER -->
  <header id="header"></header>

  <!-- ADMIN CONTENT -->
  <main class="admin-wrapper">

    <section class="admin-heading">
      <span class="admin-heading-tag">ADMINISTRATOR</span>
      <h1>Admin Dashboard</h1>
      <p>Kelola user dan resep yang tersedia di Nasi Liwet Nusantara.</p>
    </section>

    <!-- USER MANAGEMENT -->
    <section class="admin-section">

      <div class="admin-section-heading">
        <div>
          <span class="admin-section-tag">USER MANAGEMENT</span>
          <h2>User Management</h2>
        </div>

        <button type="button" class="admin-primary-btn" id="add-user-btn">
          + Add User
        </button>
      </div>

      <div class="admin-table-card">

        <div class="table-responsive">

          <table class="table admin-table">

            <thead>
              <tr>
                <th>No</th>
                <th>Username</th>
                <th>Nama</th>
                <th>Email</th>
                <th>Role</th>
                <th>Aksi</th>
              </tr>
            </thead>

            <tbody id="user-table-body">
            </tbody>

          </table>

        </div>

      </div>

    </section>


    <!-- RECIPE MANAGEMENT -->
    <section class="admin-section">

      <div class="admin-section-heading">

        <div>
          <span class="admin-section-tag">RECIPE MANAGEMENT</span>
          <h2>Recipe Management</h2>
        </div>

      </div>


      <div class="admin-table-card">

        <div class="table-responsive">

          <table class="table admin-table">

            <thead>
              <tr>
                <th>No</th>
                <th>Resep</th>
                <th>Kategori</th>
                <th>Metode</th>
                <th>Sumber</th>
                <th>Aksi</th>
              </tr>
            </thead>

            <tbody id="recipe-table-body">
            </tbody>

          </table>

        </div>

      </div>

    </section>

  </main>


  <!-- USER MODAL -->
  <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog">

      <div class="modal-content admin-modal">

        <div class="modal-header">

          <h5 class="modal-title" id="user-modal-title">
            Add User
          </h5>

          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

        </div>


        <div class="modal-body">

          <form id="user-form">

            <input type="hidden" id="user-index"/>

            <div class="admin-form-group">
              <label for="user-username">Username</label>

              <input type="text" id="user-username" class="form-control" required/>
            </div>


            <div class="admin-form-group">
              <label for="user-name">Nama</label>

              <input type="text" id="user-name" class="form-control" required/>
            </div>


            <div class="admin-form-group">
              <label for="user-email">Email</label>

              <input type="email" id="user-email" class="form-control" required/>
            </div>


            <div class="admin-form-group">

              <label for="user-role">Role</label>

              <select id="user-role" class="form-select"
              >

                <option value="user">
                  User
                </option>

                <option value="admin">
                  Admin
                </option>

              </select>

            </div>

          </form>

        </div>


        <div class="modal-footer">

          <button type="button" class="admin-cancel-btn" data-bs-dismiss="modal">
            Cancel
          </button>

          <button type="button" class="admin-primary-btn" id="save-user-btn"
          >
            Save
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- RECIPE MODAL -->
  <div class="modal fade" id="recipeModal" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog modal-lg">

      <div class="modal-content admin-modal">

        <div class="modal-header">

          <h5 class="modal-title">
            Edit Recipe
          </h5>

          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

        </div>


        <div class="modal-body">

          <form id="recipe-form">

            <input type="hidden" id="recipe-index"/>


            <div class="admin-form-group">

              <label for="recipe-title">
                Recipe Title
              </label>

              <input type="text" id="recipe-title" class="form-control" required/>

            </div>


            <div class="row">

              <div class="col-md-6">

                <div class="admin-form-group">

                  <label for="recipe-category">
                    Category
                  </label>

                  <select id="recipe-category" class="form-select"
                  >

                    <option value="sunda">
                      Sunda
                    </option>

                    <option value="solo">
                      Solo
                    </option>

                  </select>

                </div>

              </div>


              <div class="col-md-6">

                <div class="admin-form-group">

                  <label for="recipe-method">
                    Method
                  </label>

                  <select id="recipe-method" class="form-select"
                  >

                    <option value="rice-cooker">
                      Rice Cooker
                    </option>

                    <option value="tradisional">
                      Traditional
                    </option>

                  </select>

                </div>

              </div>

            </div>


            <div class="admin-form-group">

              <label for="recipe-time">
                Time
              </label>

              <input type="text" id="recipe-time" class="form-control" required/>

            </div>


            <div class="admin-form-group">

              <label for="recipe-servings">
                Portion
              </label>

              <input type="text" id="recipe-servings" class="form-control" required/>

            </div>


            <div class="admin-form-group">

              <label for="recipe-source">
                Source
              </label>

              <input type="text" id="recipe-source" class="form-control" required/>

            </div>


            <div class="admin-form-group">

              <label for="recipe-description">
                Description
              </label>

              <textarea id="recipe-description" class="form-control" rows="4" required></textarea>

            </div>

          </form>

        </div>


        <div class="modal-footer">

          <button type="button" class="admin-cancel-btn" data-bs-dismiss="modal">
            Cancel
          </button>

          <button type="button" class="admin-primary-btn" id="save-recipe-btn">
            Save Changes
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- JQUERY -->
  <script
    src="https://code.jquery.com/jquery-4.0.0.js"
    integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
    crossorigin="anonymous"
  ></script>


  <!-- BOOTSTRAP -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>


  <!-- EXISTING JAVASCRIPT -->
  <script src="./script/auth.js"></script>
  <script src="./script/header.js"></script>

  <!-- RECIPE DATA -->
  <script src="./script/recipes.js"></script>

  <!-- YOUR ADMIN JAVASCRIPT -->
  <script src="./script/admin.js"></script>

</body>

</html>
